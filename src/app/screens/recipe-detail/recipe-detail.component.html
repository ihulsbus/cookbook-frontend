<div class=" px-4 py-4 md:px-6 lg:px-8">
  <div class="flex flex-row flex-wrap">
    <div>
      <p-buttongroup>
      <p-button [rounded]="true" [raised]="true" [outlined]="true" label="Back" icon="pi pi-arrow-left" severity="primary" [routerLink] = "['/app/recipes']"></p-button>
      <p-button [rounded]="true" [raised]="true" [outlined]="true" label="Edit" icon="pi pi-pencil" severity="secondary" [routerLink] = "['/app/recipes/'+recipe.id+'/edit']"></p-button>
      </p-buttongroup>
    </div>
  </div>
  <div class="grid grid-nogutter surface-section text-800">
    <div class="col-12 md:col-6 pl-4 pt-4text-center md:text-left flex align-items-center ">
      <section>
        <span class="block text-6xl font-bold mb-1">{{ recipe.name }}</span>
        <p class="mt-0 mb-4 text-700 line-height-3">{{ recipe.description }}</p>
        <div class="p-grid p-formgrid p-fluid mt-0 mb-4 text-700 line-height-3">
          <div>
            <span class="p-row-1">
              <i class="pi pi-clock p-mr-5"></i>
              {{ metadata.preparation_time }} Minutes <!-- #TODO fix cookTime -->
            </span>
            <br>
            <span class="p-row-1">
              <i class="pi pi-user p-mr-5"></i>
              {{ metadata.serving_count }} persons
            </span>
          </div>
          <div class="mt-8">
            <span *ngFor="let category of metadata.categories" class="p-row-1">
              <p-chip label="{{category.name}}" [style]="{'margin-right': '0.5rem'}"></p-chip>
            </span>
          </div>
          <div class="mt-1">
            <span *ngFor="let tag of metadata.tags" class="p-row-1 mt-1">
              <p-tag value="{{tag.name}}" [rounded]="true" [style]="{'margin-right': '0.5rem'}"></p-tag>
            </span>
          </div>
        </div>
      </section>
      <section>
        <div class="p-grid p-formgrid p-fluid mt-0 mb-4 text-700 line-height-3">
        </div>
      </section>
    </div>
    <div class="col-12 md:col-6 overflow-hidden">
      <img src="{{imgUrl}}" onerror="this.src='assets/images/placeholder.png';" alt="Image" class="md:ml-auto block md:h-full"
        style="max-height: 487px; clip-path: polygon(8% 0, 100% 0%, 100% 100%, 0 100%)">
    </div>
  </div>
  <div class="grid">
    <app-ingredient-list [recipeID]="recipe.id" class="col-12 lg:col-4 xl:col-3"></app-ingredient-list>

    <div class="col-12 lg:col-8 xl:col-9">
      <div class="p-3 h-full">
        <div class="shadow-2 p-3 h-full flex flex-column surface-card" style="border-radius: 6px">
          <div class="text-900 font-medium text-xl mb-2">Method</div>
          <hr class="my-3 mx-0 border-top-1 border-none surface-border" />
          <div *ngFor="let step of instructions" class="mb-3">
            <div class="text-900 font-semibold mb-1">Step {{ step.sequence }}</div>
            <div class="text-700" [innerHTML]="step.description"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
