name: Build and test

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadless

      # Lint has a large pre-existing backlog (mostly in the OpenAPI-generated
      # src/app/lib/api-client/ code, which regenerates from the backend spec
      # and isn't meant to be hand-fixed - see KIT-73). Reported, not gated,
      # until that debt is tracked down separately.
      - name: Lint
        continue-on-error: true
        run: npx ng lint
